[MainInfo]
;=================================================================================
; CustomerName: Seu Customername (deve ser igual do Common.dat)
; IpAddress: IP da sua VPS (ou dominio de redirecionamento cloudflare)
; IpAddressPort: Porta do seu ConnectServer
; HackServerPort: Porta do HackServers
; UseIntegratedAntiHack: Usar Sistema de AntiHack intergrado
; ClientVersion: Versão do Client (deve ser igual do Common.dar e HackServer
; ClientSerial: Deve ser igual do Common.dat e do HackServer (não use o padrão)
;		 ao troca-lo, você deve encriptar novamente todos os Scripts.
; WindowName: Nome que irá aparecer na janela do Jogo
; ScreenShotPath: Nao altere
; DebugConsole: Ativa o Console de Debug do cliente
; OpenLauncher: Forca abrir o jogo pelo Launcher
;		(so habilite esta opção de estiver usando Launcher Externo)
; LauncherName = Nome do Executavel do Launcher
; MaxInstance = Maximo de janelas abertas em simuntâneo (BETA)
; RequireAdmin = Força execução do Jogo como Administrador
; RequireAdminMessage = Exibe mensagem de confirmação de Administrador
; BlockVirtualMachine = Bloqueio de Maquinas Virtuais
;=================================================================================
