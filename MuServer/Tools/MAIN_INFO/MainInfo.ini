IpAddress 			= 26.227.77.8
IpAddressPort 			= 44405
MHPServerPort			= 55999
UseIntegratedAntiHack		= 1
ClientVersion 			= 1.04.05
ClientSerial 			= TbYehR2hFUPBKgZj
WindowName 			= MuOnline
ScreenShotPath 			= ScreenShots\Screen(%02d_%02d-%02d-%02d)-%04d.jpg
OpenLauncher 			= 0
