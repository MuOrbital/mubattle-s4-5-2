; Para usar estas Opções, desative: OpenLauncher acima!
; AutoUpdateCpanel = Main.exe puxar atualizações do direto do cPanel
; AutoUpdateURL = URL de Update do cPanel (mantenha https:// e termine com / )
; As cores da tela de atualizacao sao definidas no arquivo UpdateColors.txt
; MaxUpdateTips: Maximo de Dicas na tela de Update Configure em UpdateColors.txt
